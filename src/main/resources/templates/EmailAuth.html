<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>dodum 이메일 인증</title>
    <style>
        :root {
            --default-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            Ubuntu, "Helvetica Neue", Helvetica, Arial, "PingFang SC",
            "Hiragino Sans GB", "Microsoft Yahei UI", "Microsoft Yahei",
            "Source Han Sans CN", sans-serif;
            --green-main: #26874e;
            --green-light: #72d49a;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, var(--default-font-family);
            background-color: #f5f5f5;
        }

        .main-container {
            width: 80vw;
            min-height: 92.6vw;
            background-color: #ffffff;
            border-radius: 4.31vw;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
        }

        .top-bar {
            width: 100%;
            height: 1.9vw;
            background-color: var(--green-main);
        }

        .logo {
            width: 18.7vw;
            height: 6.03vw;
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
            background-image: url("https://codia-f2c.s3.us-west-1.amazonaws.com/image/2025-11-05/tjFxxjGS2V.png");
            margin-top: 3.7vw;
            margin-left: 30.6vw;
        }

        .badge {
            width: 22.59vw;
            height: 4.57vw;
            border-radius: 30px;
            border: 1px solid var(--green-main);
            position: relative;
            margin-top: 2.07vw;
            margin-left: 28.7vw;
        }

        .badge-text {
            position: absolute;
            top: 0.8vw;
            left: 2.2vw;
            font-size: 2.6vw;
            font-weight: 500;
            line-height: 1.2;
            color: var(--green-main);
            white-space: nowrap;
        }

        .title {
            margin: 15.78vw 0 0 23.28vw;
            font-size: 3.45vw;
            font-weight: 600;
            line-height: 1.2;
            color: #000000;
            white-space: nowrap;
        }

        .subtitle {
            margin-top: 5.09vw;
            margin-left: 17.07vw;
            width: 45.7vw;
            font-size: 2.59vw;
            font-weight: 500;
            line-height: 1.3;
            color: #585858;
            text-align: center;
        }

        .code-box {
            width: 50.69vw;
            height: 13.36vw;
            background-color: #ffffff;
            border-radius: 4.31vw;
            border: 1px solid var(--green-main);
            box-shadow: 0 0 0.86vw 0 rgba(38, 135, 78, 0.15);
            position: relative;
            margin-top: 12.07vw;
            margin-left: 14.66vw;
        }

        .code-number {
            position: absolute;
            top: 3.5vw;
            left: 15vw;
            font-size: 5.17vw;
            font-weight: 700;
            line-height: 1.2;
            color: var(--green-main);
            white-space: nowrap;
        }

        .info-text {
            width: 36.5vw;
            margin-top: 2.85vw;
            margin-left: 21.64vw;
            font-size: 2.59vw;
            font-weight: 500;
            line-height: 1.3;
            text-align: center;
            color: var(--green-light);
            white-space: nowrap;
        }

        .info-text .highlight {
            font-weight: 700;
        }

        .divider {
            position: absolute;
            top: 21.98vw;
            left: 5.6vw;
            width: 74.4vw;
            height: 1px;
            background-image: url("https://codia-f2c.s3.us-west-1.amazonaws.com/image/2025-11-05/KxvQw4JuHp.png");
            background-position: center;
            background-size: cover;
            background-repeat: no-repeat;
        }

        input,
        select,
        textarea,
        button {
            outline: 0;
        }
    </style>
</head>
<body>
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이메일 인증 요청</title>
    <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap"
    />
    <link rel="stylesheet" href="index.css" />
</head>
<body>
<div class="main-container">
    <div class="top-bar"></div>
    <div class="logo"></div>
    <div class="badge">
        <span class="badge-text">이메일 인증 요청</span>
    </div>
    <h1 class="title">이메일 인증을 해주세요</h1>
    <p class="subtitle">
        회원님의 계정을 안전하게 보호하기 위해 <br />
        아래의 인증번호를 입력해주세요
    </p>
    <div class="code-box">
        <span class="code-number" th:text = "${authNum}"></span>
    </div>
    <p class="info-text">
        <span>인증번호는 </span>
        <span class="highlight">5분</span>
        <span> 동안 유효합니다.</span>
    </p>
    <div class="divider"></div>
</div>
</body>
</html>


</body>
</html>

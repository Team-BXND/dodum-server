<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>dodum 이메일 인증 요청</title>
</head>
<body>
<div style='max-width:520px; margin:auto; background:#ffffff; font-family:"Inter", "Noto Sans KR", sans-serif; border-radius:24px; overflow:hidden; box-shadow:0 8px 24px rgba(0,0,0,0.1);'>
    <div style='background:linear-gradient(135deg, #4ade80, #86efac); padding:40px 24px; text-align:center;'>
        <h1 style='color:#065f46; font-size:30px; font-weight:800; margin:0;'>dodum</h1>
        <p style='color:rgba(5,46,22,0.85); font-size:15px; margin-top:8px;'>이메일 인증 요청</p>
    </div>
    <div style='background:#ffffff; padding:40px 32px; text-align:center;'>
        <h2 style='color:#1f2937; font-size:22px; font-weight:700; margin-bottom:16px;'>이메일을 인증해주세요</h2>
        <p style='color:#6b7280; font-size:15px; line-height:1.7; margin-bottom:36px;'>회원님의 계정을 안전하게 보호하기 위해<br>아래의 인증번호를 입력해주세요.</p>
        <div style='display:inline-block; background:#f9fafb; border:2px solid #4ade80; border-radius:14px; padding:24px 36px; margin-bottom:32px;'>
            <span style='font-size:38px; font-weight:900; letter-spacing:10px; color:#059669; font-family:"SF Mono", monospace;'>
                [[${authNum}]]
            </span>
        </div>
        <p style='font-size:14px; color:#059669; background:rgba(74,222,128,0.12); display:inline-block; padding:12px 18px; border-radius:10px; margin-bottom:28px;'>
            ⏰ 인증번호는 <strong>10분</strong> 동안만 유효합니다.
        </p>
        <p style='font-size:13px; color:#6b7280; margin-top:18px; line-height:1.6;'>본 메일은 <strong style='color:#059669;'>dodum</strong> 서비스에서 자동으로 발송되었습니다.<br>답장이 필요하지 않습니다.</p>
    </div>
    <div style='background:#f9fafb; padding:18px; text-align:center; border-top:1px solid #e5e7eb;'>
        <p style='font-size:12px; color:#9ca3af; margin:0;'>© 2025 dodum. All rights reserved.</p>
    </div>
</div>
</body>
</html>
